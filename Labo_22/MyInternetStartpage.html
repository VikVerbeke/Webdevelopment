<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Internet Start page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <div class="row">
        <div class="col-12">
            <h1>My Internet Start Page</h1>

            <div class="mb-3 mt-4">
                <label for="Zoekopdracht" class="form-label">Zoekopdracht</label>

                <input type="text" id="Zoekopdracht" class="form-control" placeholder="Enter commando">
            </div>


            <button id="GOknop" class="btn btn-success w-100">GO!</button>
        </div>
    </div>

    <div class="row mt-5">
        <div class="col-12">
            <h2>History</h2>
        </div>
    </div>

    <!-- Hier komen de dynamisch gegenereerde Bootstrap kaarten -->
    <div class="row g-3" id="history">
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1IfW4pNLIhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN95405Q" crossorigin="anonymous"></script>
<script src="Scripts/ScriptInternetStartPage.js"></script>
</body>
</html>
